name: Update Dev Stats Card

on:
  schedule:
    - cron: "30 6 * * *" # daily
  workflow_dispatch: # lets you run it manually
  push:
    paths:
      - scripts/generate_stats_card.py
      - .github/workflows/dev-stats.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_stats_card.py --output assets/dev-stats.svg

      - name: Commit & push if changed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/dev-stats.svg
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update dev stats card"
            git pull --rebase
            git push
          fi
