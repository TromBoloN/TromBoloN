<text x="24" y="94" class="mo" font-size="10" fill="#9c7b4a" text-anchor="start" >WEB DEVELOPMENT COMPETITION PLATFORM</text>
<text x="24" y="120" class="ty" font-size="12.5" fill="#d9cfbd" opacity=".9">Official portal for the MIT-WEEK 2026 web development competition. Teams submit their work; judges score it</text>
