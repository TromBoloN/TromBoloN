<svg xmlns="http://www.w3.org/2000/svg" width="860" height="390" viewBox="0 0 860 390" role="img" aria-label="Certified competencies: LANGUAGES: Python, TypeScript, JavaScript, PHP, C++, HTML5, CSS3; INTERFACE: Next.js, React, Vite, Tailwind CSS, shadcn/ui, Bootstrap; INFRASTRUCTURE: Django, FastAPI, Laravel, Supabase, PostgreSQL, SQLite, REST API; CARTOGRAPHY &amp; DATA: Leaflet, Turf.js, GeoPandas, Pandas, Chart.js; TOOLING: Git, GitHub, GitHub Actions, VS Code"><title>Certified competencies: LANGUAGES: Python, TypeScript, JavaScript, PHP, C++, HTML5, CSS3; INTERFACE: Next.js, React, Vite, Tailwind CSS, shadcn/ui, Bootstrap; INFRASTRUCTURE: Django, FastAPI, Laravel, Supabase, PostgreSQL, SQLite, REST API; CARTOGRAPHY &amp; DATA: Leaflet, Turf.js, GeoPandas, Pandas, Chart.js; TOOLING: Git, GitHub, GitHub Actions, VS Code</title><style>
.se{font-family:Georgia,'Times New Roman',Times,serif}
