<svg xmlns="http://www.w3.org/2000/svg" width="420" height="295" viewBox="0 0 420 295" role="img" aria-label="Case file CR-64-003: WebGIS Kaltim. Leaflet map of regional power plants with a renewable-share choropleth, search, filters and CSV export."><title>Case file CR-64-003: WebGIS Kaltim. Leaflet map of regional power plants with a renewable-share choropleth, search, filters and CSV export.</title><style>
.se{font-family:Georgia,'Times New Roman',Times,serif}
.mo{font-family:Consolas,'Liberation Mono','Courier New',monospace;text-transform:uppercase;letter-spacing:.02em}
.ty{font-family:'Courier New',Courier,'Liberation Mono',monospace}
